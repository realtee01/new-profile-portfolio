<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logo-grad-favicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c770f0" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <clipPath id="circle-clip-favicon">
      <circle cx="50" cy="50" r="50" />
    </clipPath>
    <mask id="logo-mask-favicon">
      <rect x="0" y="0" width="100" height="100" fill="black" />
      <circle cx="50" cy="50" r="50" fill="white" />
      <circle cx="50" cy="50" r="32" fill="black" />
      <rect x="0" y="0" width="71" height="100" fill="black" />
      <rect x="53" y="0" width="18" height="100" fill="white" />
      <rect x="71" y="42" width="29" height="16" fill="white" />
      <rect x="29" y="30" width="18" height="70" fill="white" />
      <rect x="0" y="0" width="47" height="30" fill="white" />
    </mask>
  </defs>
  <!-- Premium dark background squircle -->
  <rect width="100" height="100" rx="22" fill="#06020c" />
  <!-- Logo scaled and centered with perfect padding -->
  <g transform="translate(14, 14) scale(0.72)">
    <rect x="0" y="0" width="100" height="100" fill="url(#logo-grad-favicon)" clipPath="url(#circle-clip-favicon)" mask="url(#logo-mask-favicon)" />
  </g>
</svg>
